# ---- Gradle / JVM ----
# The JDK comes from the Java 21 toolchain in build.gradle.kts. Pin a local JDK in
# ~/.gradle/gradle.properties with org.gradle.java.home, never in this versioned file.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---- Fabric / Minecraft (1.21.11) ----
minecraft_version=1.21.11
loader_version=0.19.3
fabric_version=0.141.4+1.21.11

# ---- GeckoLib ----
# Client-side renderer for the four machines. The server never loads it, so every
# call into it stays behind the client entrypoint.
geckolib_version=5.4.5

# ---- Mod ----
mod_version=1.0.0
maven_group=oas.dreyka.tripoddawn
archives_base_name=tripoddawn
